<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d2b">
<title>Star Catcher</title>
<style>
  :root { --bg:#0b0d2b; --ink:#fff; --accent:#ffd34d; --bad:#ff5b6e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; background: linear-gradient(#0b0d2b, #1a1352 60%, #2b1466); }
  #hud {
    position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0;
    padding: 14px 18px; display: flex; justify-content: space-between;
    font-weight: 700; font-size: 18px; pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #hud .lives { color: var(--bad); }
  #hud .score { color: var(--accent); }
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,9,28,.78); backdrop-filter: blur(6px);
    text-align: center; padding: 24px; z-index: 10;
  }
  .panel { max-width: 360px; }
  h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: .5px; }
  h1 .star { color: var(--accent); }
  p { margin: 8px 0 18px; opacity: .85; line-height: 1.4; }
  button {
    background: var(--accent); color: #2a1d00; border: 0;
    padding: 14px 28px; border-radius: 999px;
    font-weight: 800; font-size: 18px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,211,77,.35);
  }
  button:active { transform: translateY(1px); }
  .small { font-size: 13px; opacity: .6; margin-top: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <div class="lives" id="lives">♥♥♥</div>
  <div class="score" id="score">0</div>
</div>

<div class="overlay" id="start">
  <div class="panel">
    <h1>Star <span class="star">★</span> Catcher</h1>
    <p>Drag anywhere to move the basket.<br>Catch stars. Dodge bombs.</p>
    <button id="playBtn">Play</button>
    <div class="small">Best: <span id="bestStart">0</span></div>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="panel">
    <h1>Game Over</h1>
    <p>Score: <b id="finalScore">0</b><br>Best: <b id="finalBest">0</b></p>
    <button id="againBtn">Play again</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hudScore = document.getElementById('score');
  const hudLives = document.getElementById('lives');
  const startEl = document.getElementById('start');
  const overEl = document.getElementById('over');
  const playBtn = document.getElementById('playBtn');
  const againBtn = document.getElementById('againBtn');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const bestStart = document.getElementById('bestStart');

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const BEST_KEY = 'starcatcher_best_v1';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestStart.textContent = best;

  const state = {
    running: false,
    score: 0,
    lives: 3,
    basket: { x: 0, y: 0, w: 90, h: 22 },
    items: [],
    stars: [], // background stars
    spawnTimer: 0,
    spawnEvery: 0.85,
    speed: 220,
    elapsed: 0,
    flash: 0,
    shake: 0,
  };

  function reset() {
    state.score = 0;
    state.lives = 3;
    state.items.length = 0;
    state.spawnTimer = 0;
    state.spawnEvery = 0.85;
    state.speed = 220;
    state.elapsed = 0;
    state.flash = 0;
    state.shake = 0;
    state.basket.w = Math.max(70, Math.min(110, W * 0.22));
    state.basket.h = 22;
    state.basket.x = W / 2;
    state.basket.y = H - 70 - (window.visualViewport ? 0 : 0);
    updateHUD();
    seedBgStars();
  }

  function seedBgStars() {
    state.stars.length = 0;
    const n = Math.floor((W * H) / 9000);
    for (let i = 0; i < n; i++) {
      state.stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.2,
        tw: Math.random() * Math.PI * 2,
      });
    }
  }

  function updateHUD() {
    hudScore.textContent = state.score;
    hudLives.textContent = '♥'.repeat(state.lives) + '<span style="opacity:.25">' + '♥'.repeat(Math.max(0, 3 - state.lives)) + '</span>';
    hudLives.innerHTML = '<span style="color:#ff5b6e">' + '♥'.repeat(state.lives) + '</span>' +
                         '<span style="opacity:.2">' + '♥'.repeat(Math.max(0, 3 - state.lives)) + '</span>';
  }

  // input — drag anywhere
  let dragging = false;
  let dragOffset = 0;
  function pointerXY(e) {
    if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function onDown(e) {
    if (!state.running) return;
    e.preventDefault();
    const p = pointerXY(e);
    dragging = true;
    // if tap is near basket, preserve relative offset, else snap
    const dx = p.x - state.basket.x;
    dragOffset = Math.abs(dx) < state.basket.w ? dx : 0;
    state.basket.x = clamp(p.x - dragOffset, state.basket.w / 2, W - state.basket.w / 2);
  }
  function onMove(e) {
    if (!dragging || !state.running) return;
    e.preventDefault();
    const p = pointerXY(e);
    state.basket.x = clamp(p.x - dragOffset, state.basket.w / 2, W - state.basket.w / 2);
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function spawn() {
    // 18% bombs after first 5s
    const bombChance = state.elapsed < 5 ? 0 : Math.min(0.28, 0.1 + state.elapsed * 0.005);
    const isBomb = Math.random() < bombChance;
    const r = isBomb ? 16 : 14;
    state.items.push({
      x: r + Math.random() * (W - 2 * r),
      y: -r,
      r,
      vy: state.speed * (0.85 + Math.random() * 0.4),
      vx: (Math.random() - 0.5) * 40,
      bomb: isBomb,
      spin: Math.random() * Math.PI * 2,
      vspin: (Math.random() - 0.5) * 4,
    });
  }

  function loseLife() {
    state.lives--;
    state.flash = 0.35;
    state.shake = 14;
    updateHUD();
    if (state.lives <= 0) gameOver();
  }

  function gameOver() {
    state.running = false;
    if (state.score > best) {
      best = state.score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    finalScore.textContent = state.score;
    finalBest.textContent = best;
    overEl.classList.remove('hidden');
  }

  function start() {
    reset();
    startEl.classList.add('hidden');
    overEl.classList.add('hidden');
    state.running = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }
  playBtn.addEventListener('click', start);
  againBtn.addEventListener('click', start);

  // draw helpers
  function drawStar(x, y, r, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      const rr = i % 2 === 0 ? r : r * 0.45;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBomb(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    // highlight
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.arc(-r * 0.35, -r * 0.35, r * 0.35, 0, Math.PI * 2);
    ctx.fill();
    // fuse
    ctx.strokeStyle = '#a86';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(r * 0.4, -r * 1.4, r * 0.7, -r * 1.5);
    ctx.stroke();
    // spark
    ctx.fillStyle = '#ffb84d';
    ctx.beginPath();
    ctx.arc(r * 0.7, -r * 1.5, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBasket(b) {
    const x = b.x, y = b.y, w = b.w, h = b.h;
    ctx.save();
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(x, y + h + 6, w * 0.55, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    // body
    const grd = ctx.createLinearGradient(0, y - h, 0, y + h);
    grd.addColorStop(0, '#e6a23a');
    grd.addColorStop(1, '#7a4a10');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y - h / 2);
    ctx.lineTo(x + w / 2, y - h / 2);
    ctx.lineTo(x + w / 2 - 8, y + h / 2);
    ctx.lineTo(x - w / 2 + 8, y + h / 2);
    ctx.closePath();
    ctx.fill();
    // rim
    ctx.fillStyle = '#ffd58a';
    ctx.fillRect(x - w / 2 - 2, y - h / 2 - 4, w + 4, 6);
    // weave lines
    ctx.strokeStyle = 'rgba(0,0,0,.25)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      const t = i / 5;
      const lx1 = x - w / 2 + t * 8;
      const lx2 = x + w / 2 - t * 8;
      const ly = y - h / 2 + t * h;
      ctx.beginPath();
      ctx.moveTo(lx1, ly);
      ctx.lineTo(lx2, ly);
      ctx.stroke();
    }
    ctx.restore();
  }

  let last = 0;
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (state.running) update(dt);
    render();
    if (state.running) requestAnimationFrame(loop);
    else render(); // final frame already drawn
  }

  function update(dt) {
    state.elapsed += dt;
    state.speed = 220 + state.elapsed * 9;
    state.spawnEvery = Math.max(0.28, 0.85 - state.elapsed * 0.012);
    state.spawnTimer += dt;
    while (state.spawnTimer >= state.spawnEvery) {
      state.spawnTimer -= state.spawnEvery;
      spawn();
    }

    // basket follow
    state.basket.y = H - 70;

    // items
    for (let i = state.items.length - 1; i >= 0; i--) {
      const it = state.items[i];
      it.y += it.vy * dt;
      it.x += it.vx * dt;
      it.spin += it.vspin * dt;
      if (it.x < it.r) { it.x = it.r; it.vx *= -1; }
      if (it.x > W - it.r) { it.x = W - it.r; it.vx *= -1; }

      // collide with basket (rect)
      const b = state.basket;
      const within =
        it.y + it.r > b.y - b.h / 2 &&
        it.y - it.r < b.y + b.h / 2 &&
        it.x > b.x - b.w / 2 &&
        it.x < b.x + b.w / 2;
      if (within) {
        if (it.bomb) {
          loseLife();
        } else {
          state.score += 1;
          if (state.score % 10 === 0 && state.lives < 3) {
            state.lives++;
            updateHUD();
          } else updateHUD();
        }
        state.items.splice(i, 1);
        continue;
      }
      // off-screen
      if (it.y - it.r > H) {
        if (!it.bomb) loseLife();
        state.items.splice(i, 1);
      }
    }

    // bg twinkle
    for (const s of state.stars) s.tw += dt * 2;
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 1.5);
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 30);
  }

  function render() {
    ctx.save();
    let sx = 0, sy = 0;
    if (state.shake > 0) {
      sx = (Math.random() - 0.5) * state.shake;
      sy = (Math.random() - 0.5) * state.shake;
    }
    ctx.translate(sx, sy);

    // bg gradient already on canvas style; paint sky to clear
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b0d2b');
    g.addColorStop(0.6, '#1a1352');
    g.addColorStop(1, '#2b1466');
    ctx.fillStyle = g;
    ctx.fillRect(-30, -30, W + 60, H + 60);

    // bg stars
    for (const s of state.stars) {
      const a = 0.4 + Math.sin(s.tw) * 0.4;
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // ground glow
    const glow = ctx.createRadialGradient(W / 2, H + 80, 20, W / 2, H + 80, Math.max(W, 320));
    glow.addColorStop(0, 'rgba(255,211,77,.18)');
    glow.addColorStop(1, 'rgba(255,211,77,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // items
    for (const it of state.items) {
      if (it.bomb) drawBomb(it.x, it.y, it.r, it.spin);
      else {
        // glow
        const grad = ctx.createRadialGradient(it.x, it.y, 0, it.x, it.y, it.r * 2.5);
        grad.addColorStop(0, 'rgba(255,211,77,.55)');
        grad.addColorStop(1, 'rgba(255,211,77,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.r * 2.5, 0, Math.PI * 2);
        ctx.fill();
        drawStar(it.x, it.y, it.r, it.spin, '#ffd34d');
      }
    }

    drawBasket(state.basket);

    if (state.flash > 0) {
      ctx.fillStyle = 'rgba(255,91,110,' + state.flash.toFixed(2) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
  }

  // initial draw so the menu has a backdrop
  reset();
  render();
})();
</script>
</body>
</html>
